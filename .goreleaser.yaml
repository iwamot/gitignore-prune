version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: gitignore-prune
    binaries:
      - gitignore-prune
    homepage: "https://github.com/iwamot/gitignore-prune"
    description: "Detect .gitignore entries that no longer match anything in the working tree."
    repository:
      owner: iwamot
      name: homebrew-tap
    skip_upload: "true"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gitignore-prune"]
          end

checksum:
  name_template: 'checksums.txt'

release:
  draft: true
  use_existing_draft: true

changelog:
  use: github-native
