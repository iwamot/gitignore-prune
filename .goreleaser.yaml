version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: gitignore-prune
    binaries:
      - gitignore-prune
    homepage: "https://github.com/iwamot/gitignore-prune"
    description: "Detect .gitignore entries that no longer match anything in the working tree."
    repository:
      owner: iwamot
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: "iwamot-homebrew-tap[bot]"
      email: "284326920+iwamot-homebrew-tap[bot]@users.noreply.github.com"
    commit_msg_template: "feat: brew cask update for {{ .ProjectName }} version {{ .Tag }}"

checksum:
  name_template: 'checksums.txt'

release:
  draft: true
  use_existing_draft: true

changelog:
  use: github-native
