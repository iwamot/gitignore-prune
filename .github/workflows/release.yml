name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write  # to create the GitHub Release and upload binary archives
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0

      - uses: iwamot/actions/go-publish@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: iwamot
          repositories: homebrew-tap
          permission-contents: write  # createCommitOnBranch on the cask update branch
          permission-pull-requests: write  # open and auto-merge the cask PR

      - name: Submit cask PR to homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CASK_FILE=$(find dist -name 'gitignore-prune.rb' -type f | head -1)
          if [ -z "$CASK_FILE" ]; then
            echo "Cask file not found under dist/" >&2
            exit 1
          fi
          CONTENTS_B64=$(base64 -w0 < "$CASK_FILE")
          BRANCH="cask-update-${TAG}"
          BOT_NAME="iwamot-homebrew-tap[bot]"
          BOT_EMAIL="284326920+iwamot-homebrew-tap[bot]@users.noreply.github.com"

          gh api -X DELETE "/repos/iwamot/homebrew-tap/git/refs/heads/${BRANCH}" 2>/dev/null || true

          MAIN_SHA=$(gh api /repos/iwamot/homebrew-tap/git/refs/heads/main --jq '.object.sha')

          gh api -X POST /repos/iwamot/homebrew-tap/git/refs \
            -f ref="refs/heads/${BRANCH}" \
            -f sha="${MAIN_SHA}" >/dev/null

          QUERY=$(cat <<'GRAPHQL'
          mutation($repo: String!, $branch: String!, $headline: String!, $body: String!, $path: String!, $contents: Base64String!, $oid: GitObjectID!) {
            createCommitOnBranch(input: {
              branch: { repositoryNameWithOwner: $repo, branchName: $branch }
              message: { headline: $headline, body: $body }
              fileChanges: { additions: [{ path: $path, contents: $contents }] }
              expectedHeadOid: $oid
            }) { commit { oid } }
          }
          GRAPHQL
          )

          gh api graphql -f query="$QUERY" \
            -f repo="iwamot/homebrew-tap" \
            -f branch="${BRANCH}" \
            -f headline="feat: brew cask update for gitignore-prune version ${TAG}" \
            -f body="Signed-off-by: ${BOT_NAME} <${BOT_EMAIL}>" \
            -f path="Casks/gitignore-prune.rb" \
            -f contents="${CONTENTS_B64}" \
            -f oid="${MAIN_SHA}" >/dev/null

          gh pr create -R iwamot/homebrew-tap \
            --head "${BRANCH}" \
            --base main \
            --title "feat: brew cask update for gitignore-prune version ${TAG}" \
            --body "Automated cask update from gitignore-prune ${TAG} release."

          gh pr merge -R iwamot/homebrew-tap "${BRANCH}" \
            --squash --auto --delete-branch

      - uses: iwamot/actions/release-publish@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0
